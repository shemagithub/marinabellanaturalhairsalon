openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: salon
    description: Salon services, appointments, and client management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /services:
    get:
      operationId: listServices
      tags: [salon]
      summary: List salon services
      responses:
        "200":
          description: Salon services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [salon]
      summary: Create a salon service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /services/{serviceId}:
    patch:
      operationId: updateService
      tags: [salon]
      summary: Update a salon service
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Service not found
    delete:
      operationId: deleteService
      tags: [salon]
      summary: Delete a salon service
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Service deleted
        "404":
          description: Service not found
  /stylists:
    get:
      operationId: listStylists
      tags: [salon]
      summary: List salon stylists
      responses:
        "200":
          description: Salon stylists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stylist"
  /availability:
    get:
      operationId: getAvailability
      tags: [salon]
      summary: Get available appointment slots
      parameters:
        - name: serviceId
          in: query
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: stylistId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Available appointment slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeSlot"
  /bookings:
    get:
      operationId: listBookings
      tags: [salon]
      summary: List appointments for the staff calendar
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [confirmed, cancelled, completed]
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [salon]
      summary: Create an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Confirmed appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "409":
          description: The selected appointment time is no longer available
  /bookings/{bookingId}:
    patch:
      operationId: updateBooking
      tags: [salon]
      summary: Update appointment status or notes
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Appointment not found
  /clients:
    get:
      operationId: listClients
      tags: [salon]
      summary: List salon clients
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Client records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [salon]
      summary: Register a salon client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Invalid client details
        "409":
          description: Client email already registered
  /account/bookings:
    get:
      operationId: getMyBookings
      tags: [salon]
      summary: Get appointments for the signed-in client
      responses:
        "200":
          description: Client appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          description: Sign-in required
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [salon]
      summary: Get salon dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [salon]
      summary: List promotional campaigns
      responses:
        "200":
          description: Promotional campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromotionCampaign"
    post:
      operationId: createCampaign
      tags: [salon]
      summary: Draft a promotional campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Draft campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionCampaign"
  /campaigns/{campaignId}/send:
    post:
      operationId: sendCampaign
      tags: [salon]
      summary: Send a campaign to opted-in clients
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Campaign send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSendResult"
        "404":
          description: Campaign not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Service:
      type: object
      required: [id, name, category, description, durationMinutes, price, active]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        durationMinutes: { type: integer }
        price: { type: number }
        active: { type: boolean }
    ServiceInput:
      type: object
      required: [name, category, description, durationMinutes, price]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        description: { type: string }
        durationMinutes: { type: integer, minimum: 15 }
        price: { type: number, minimum: 0 }
    ServiceUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        description: { type: string }
        durationMinutes: { type: integer, minimum: 15 }
        price: { type: number, minimum: 0 }
        active: { type: boolean }
    Stylist:
      type: object
      required: [id, name, title]
      properties:
        id: { type: string }
        name: { type: string }
        title: { type: string }
        imageUrl: { type: ["string", "null"] }
    TimeSlot:
      type: object
      required: [startAt, endAt, stylistId, stylistName]
      properties:
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        stylistId: { type: string }
        stylistName: { type: string }
    Booking:
      type: object
      required: [id, serviceId, serviceName, stylistId, stylistName, clientName, email, phone, startAt, endAt, status, marketingOptIn, createdAt]
      properties:
        id: { type: string }
        serviceId: { type: integer }
        serviceName: { type: string }
        stylistId: { type: string }
        stylistName: { type: string }
        clientName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        status: { type: string, enum: [confirmed, cancelled, completed] }
        notes: { type: ["string", "null"] }
        marketingOptIn: { type: boolean }
        accountRequested: { type: boolean }
        createdAt: { type: string, format: date-time }
    BookingInput:
      type: object
      required: [serviceId, stylistId, clientName, email, phone, startAt]
      properties:
        serviceId: { type: integer }
        stylistId: { type: string }
        clientName: { type: string, minLength: 2 }
        email: { type: string, format: email }
        phone: { type: string, minLength: 6 }
        startAt: { type: string, format: date-time }
        notes: { type: string }
        marketingOptIn: { type: boolean }
        accountRequested: { type: boolean }
    BookingUpdate:
      type: object
      properties:
        status: { type: string, enum: [confirmed, cancelled, completed] }
        notes: { type: string }
    Client:
      type: object
      required: [id, name, email, phone, totalVisits, marketingOptIn]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        totalVisits: { type: integer }
        marketingOptIn: { type: boolean }
        lastVisit: { type: ["string", "null"], format: date-time }
    ClientInput:
      type: object
      required: [name, email, phone]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        phone: { type: string, minLength: 6 }
        marketingOptIn: { type: boolean }
    DashboardSummary:
      type: object
      required: [todayBookings, upcomingBookings, monthlyRevenue, totalClients, marketingClients, nextAppointments]
      properties:
        todayBookings: { type: integer }
        upcomingBookings: { type: integer }
        monthlyRevenue: { type: number }
        totalClients: { type: integer }
        marketingClients: { type: integer }
        nextAppointments:
          type: array
          items: { $ref: "#/components/schemas/Booking" }
    PromotionCampaign:
      type: object
      required: [id, subject, body, status, recipientCount, createdAt]
      properties:
        id: { type: string }
        subject: { type: string }
        body: { type: string }
        status: { type: string, enum: [draft, sent] }
        recipientCount: { type: integer }
        sentAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    CampaignInput:
      type: object
      required: [subject, body]
      properties:
        subject: { type: string, minLength: 3 }
        body: { type: string, minLength: 3 }
    CampaignSendResult:
      type: object
      required: [campaign, recipientCount, deliveryMode]
      properties:
        campaign: { $ref: "#/components/schemas/PromotionCampaign" }
        recipientCount: { type: integer }
        deliveryMode: { type: string }

